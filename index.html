<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Test lueurs</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0a14;color:#f0eef4;font-family:system-ui,sans-serif;
    padding:24px;min-height:100vh}
  h1{font-size:18px;margin-bottom:6px}
  p{font-size:13px;color:#aab0c0;margin-bottom:22px;line-height:1.5}
  .test{position:relative;height:150px;border:1px solid rgba(255,255,255,.15);
    border-radius:14px;margin-bottom:18px;overflow:hidden;
    display:flex;align-items:flex-end;padding:10px}
  .test .lbl{font-size:13px;font-weight:600;position:relative;z-index:5;
    background:rgba(0,0,0,.5);padding:4px 9px;border-radius:8px}

  /* Méthode 1 : filter blur sur un radial-gradient (ce qu'on utilise) */
  .m1 .glow{position:absolute;width:60%;height:120%;left:10%;top:-10%;
    border-radius:50%;background:radial-gradient(ellipse,#ff6fb0,transparent 62%);
    filter:blur(40px)}

  /* Méthode 2 : radial-gradient SANS filter blur (le dégradé floute tout seul) */
  .m2{background:radial-gradient(circle at 35% 40%, #4f8cff 0%, transparent 55%)}

  /* Méthode 3 : box-shadow diffuse (très large blur radius) */
  .m3 .glow{position:absolute;width:40px;height:40px;left:40%;top:45%;
    border-radius:50%;background:#f0a93c;
    box-shadow:0 0 120px 80px rgba(240,169,60,.55)}

  /* Méthode 4 : plusieurs radial-gradients empilés en background (aucun filter) */
  .m4{background:
    radial-gradient(circle at 20% 30%, rgba(255,111,176,.6) 0%, transparent 45%),
    radial-gradient(circle at 80% 60%, rgba(79,140,255,.6) 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(240,169,60,.5) 0%, transparent 45%)}
</style>
</head>
<body>
  <h1>Test des lueurs sur Safari</h1>
  <p>Dis-moi lesquels de ces 4 carrés montrent une lueur colorée diffuse sur ton iPhone (ouvre cette page dans Safari, comme l'app).</p>

  <div class="test m1"><div class="glow"></div><span class="lbl">1 · filter: blur</span></div>
  <div class="test m2"><span class="lbl">2 · radial-gradient seul</span></div>
  <div class="test m3"><div class="glow"></div><span class="lbl">3 · box-shadow diffuse</span></div>
  <div class="test m4"><span class="lbl">4 · radial-gradients empilés</span></div>
</body>
</html>
