<title>Tout doux — todo infinie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Aurora — deep violet-night with coloured aurora blooms */
    --bg:#0b0a14;
    --panel:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.13);
    --line-soft:rgba(255,255,255,.07);
    --ink:#f0eef4;
    --ink-dim:#aab0c0;
    --ink-faint:#6b7186;
    --amber:#f0a93c;
    --amber-soft:rgba(240,169,60,.16);
    --done:#46b894;
    --radius:10px;
    --chip-bg:rgba(255,255,255,.08);
    --pop-bg:#181626;
  }
  /* light theme: cool daylight, same identity */
  body.light{
    --bg:#eceef5;
    --panel:rgba(255,255,255,.55);
    --line:rgba(40,50,80,.14);
    --line-soft:rgba(40,50,80,.08);
    --ink:#1c2430;
    --ink-dim:#5a6678;
    --ink-faint:#9aa3b6;
    --amber:#c47d1a;
    --amber-soft:rgba(196,125,26,.16);
    --done:#2f8f6b;
    --chip-bg:rgba(0,0,0,.05);
    --pop-bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;min-height:100%}
  html{background:var(--bg)}
  html.light{background:#eceef5}
  html,body{max-width:100%;overflow-x:hidden}
  *{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    transition:color .3s ease;
  }
  /* Aurora blooms live in a FIXED layer at z-index 0 (NOT negative). On Safari
     iOS a z-index:-1 layer hides behind the opaque body background and never
     shows; keeping the layer at 0 and the content above it fixes that while the
     solid body colour underneath still prevents iOS banding. */
  .aurora-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .aurora-bg span{
    position:absolute;border-radius:50%;filter:blur(46px);will-change:transform;display:block;
  }
  .aurora-bg .a1{
    width:75vw;height:50vh;left:-15vw;top:-10vh;opacity:.22;
    background:radial-gradient(ellipse, #ff6fb0 0%, transparent 62%);
    animation:aurora1 22s ease-in-out infinite alternate;
  }
  .aurora-bg .a2{
    width:80vw;height:55vh;right:-20vw;top:32%;opacity:.24;
    background:radial-gradient(ellipse, #4f8cff 0%, transparent 62%);
    animation:aurora2 26s ease-in-out infinite alternate;
  }
  .aurora-bg .a3{
    width:70vw;height:50vh;left:6vw;bottom:-20vh;opacity:.22;
    background:radial-gradient(ellipse, var(--amber) 0%, transparent 62%);
    animation:aurora3 30s ease-in-out infinite alternate;
  }
  body.light .a1{opacity:.32} body.light .a2{opacity:.3} body.light .a3{opacity:.28}
  /* content sits above the aurora layer */
  .wrap{position:relative;z-index:1}
  @keyframes aurora1{ from{transform:translate(0,0) scale(1)} to{transform:translate(8vw,6vh) scale(1.15)} }
  @keyframes aurora2{ from{transform:translate(0,0) scale(1)} to{transform:translate(-10vw,-5vh) scale(1.1)} }
  @keyframes aurora3{ from{transform:translate(0,0) scale(1)} to{transform:translate(6vw,-8vh) scale(1.2)} }
  @media (prefers-reduced-motion:reduce){
    .aurora-bg span{animation:none}
  }
  .wrap{
    max-width:760px;margin:0 auto;
    padding:
      calc(34px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
      calc(100px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }

  /* ---- Header / breadcrumb ---- */
  header{margin-bottom:30px}
  .crumbs{
    display:flex;align-items:center;flex-wrap:wrap;gap:2px;
    font-family:'Fraunces',serif;
    margin-bottom:2px;
  }
  .crumb{
    background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-family:inherit;
    font-size:15px;padding:4px 6px;border-radius:6px;
    transition:color .15s,background .15s;
  }
  .crumb:hover{color:var(--ink);background:var(--line-soft)}
  .crumb.current{
    color:var(--ink);font-family:'Instrument Serif',serif;font-style:italic;
    font-size:42px;font-weight:400;
    padding:2px 0;cursor:default;letter-spacing:.5px;line-height:1.05;
    display:inline-flex;align-items:center;gap:12px;
  }
  .crumb.current:hover{background:none}
  .logo{width:30px;height:30px;flex:none;display:block;
    filter:drop-shadow(0 0 10px color-mix(in srgb, var(--amber) 50%, transparent))}
  .sep{color:var(--ink-faint);font-size:13px;user-select:none}
  .subtitle{color:var(--ink-faint);font-size:13px;margin-left:2px;
    display:flex;gap:10px;align-items:center}
  .subtitle:empty{display:none}

  /* ---- Task list ---- */
  ul.list{list-style:none;display:flex;flex-direction:column;gap:12px}

  /* "À faire cette semaine" recap — deliberately NOT a glass card: a plain
     outlined box so it reads as a summary, not another task block. */
  .agenda{
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px 12px;
    margin-bottom:14px;
    background:transparent;
  }
  .agenda h2{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:8px;
  }
  .agenda ul{list-style:none;display:flex;flex-direction:column;gap:1px}
  .agenda-item{
    display:flex;align-items:center;gap:10px;
    padding:5px 4px;border-radius:7px;cursor:pointer;
    transition:background .12s;
  }
  .agenda-item:hover{background:var(--line-soft)}
  .agenda-check{
    flex:none;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--ink-faint);background:none;cursor:pointer;
    padding:0;transition:border-color .12s, background .12s;
  }
  .agenda-check:hover{border-color:var(--amber)}
  .agenda-when{
    flex:none;min-width:74px;font-size:12px;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .agenda-when.soon{color:var(--amber)}
  .agenda-when.overdue{color:#cf6a5a}
  .agenda-when.urgent{color:#cf6a5a;font-weight:600}
  .agenda-text{font-size:13.5px;color:var(--ink);flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agenda-tag{
    flex:none;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
    color:#cf6a5a;border:1px solid color-mix(in srgb,#cf6a5a 40%,transparent);
    padding:1px 6px;border-radius:99px;
  }

  /* Each top-level task is frosted glass, clearly tinted by its theme colour. */
  .card{
    position:relative;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--card-dot) 22%, transparent),
        color-mix(in srgb, var(--card-dot) 10%, transparent)),
      var(--panel);
    -webkit-backdrop-filter:blur(24px) saturate(1.6);
    backdrop-filter:blur(24px) saturate(1.6);
    border:1px solid color-mix(in srgb, var(--card-dot) 38%, var(--line));
    border-radius:22px;
    box-shadow:
      0 16px 40px -22px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.18);
    overflow:hidden;
    transition:border-color .25s ease, box-shadow .3s ease, transform .18s ease,
               backdrop-filter .25s ease;
  }
  /* a coloured accent bar down the left edge — instant theme identification */
  .card{ border-left:3px solid var(--card-dot); }
  /* crisp light rim along the very top edge */
  .card::before{
    content:"";position:absolute;left:14px;right:14px;top:0;height:1px;border-radius:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    opacity:.7;z-index:2;pointer-events:none;
  }
  /* coloured glow that blooms behind the card when touched / open */
  .card .glow{
    position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(140% 90% at 50% -10%, var(--card-dot) 0%, transparent 60%);
    opacity:0;transition:opacity .35s ease;
    pointer-events:none;z-index:0;mix-blend-mode:screen;
  }
  .card.lit .glow{opacity:.30}
  .card.lit{
    border-color:color-mix(in srgb, var(--card-dot) 45%, var(--line));
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--card-dot) 20%, transparent),
      0 16px 50px -20px color-mix(in srgb, var(--card-dot) 50%, transparent),
      0 16px 40px -22px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.18);
  }
  /* keep card content above the glow layer */
  .card > *{position:relative;z-index:1}
  /* hover / press: the glass thickens slightly */
  .card:hover{ border-color:color-mix(in srgb, var(--card-dot) 35%, var(--line)); }
  .card.pressed,.card:hover{
    -webkit-backdrop-filter:blur(30px) saturate(1.7) brightness(1.04);
    backdrop-filter:blur(30px) saturate(1.7) brightness(1.04);
  }
  .card.dragover{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
  .card.done{opacity:.62}

  @supports not (backdrop-filter:blur(1px)){
    .card{background:var(--bg)}
    body.light .card{background:#ffffff}
  }
  body.light .card .glow{mix-blend-mode:soft-light}
  body.light .card.lit .glow{opacity:.45}

  .task{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 12px;
    position:relative;
  }
  .task.dragover{background:var(--amber-soft);box-shadow:inset 0 0 0 1px var(--amber);border-radius:10px}

  /* expand chevron — pure arrow, no text */
  .twirl{
    flex:none;width:22px;height:22px;margin-top:0;border-radius:6px;
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    display:grid;place-items:center;transition:.15s;
  }
  .twirl:hover{color:var(--amber);background:var(--line-soft)}
  .twirl svg{width:12px;height:12px;transition:transform .18s}
  .twirl.open svg{transform:rotate(90deg)}
  .twirl.leaf{visibility:hidden}     /* keep alignment when no children */
  .twirl.hidden{display:none}        /* card header: emoji replaces the chevron */
  .card > .task > .twirl.leaf{display:none}  /* leaf card: no wasted chevron slot */

  .check{
    flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;
    border:1.5px solid var(--ink-faint);background:none;cursor:pointer;
    display:grid;place-items:center;transition:all .15s;
  }
  .check:hover{border-color:var(--amber)}
  .check svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.15s}
  .task.done .check{background:var(--done);border-color:var(--done)}
  .task.done .check svg{opacity:1;transform:scale(1)}

  .body{flex:1;min-width:0}
  .text{
    font-size:16px;color:var(--ink);outline:none;
    word-break:break-word;border-radius:4px;padding:1px 2px;
  }
  .text:focus{box-shadow:0 0 0 2px var(--amber-soft)}
  .task.done .text{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--ink-faint)}

  /* ---- row actions (right side) ---- */
  .actions{
    flex:none;display:flex;align-items:center;gap:2px;margin-top:-2px;
  }
  /* On card headers, the badge owns the top-right; inline actions go bottom-right. */
  .card > .task > .actions{
    position:absolute;right:10px;bottom:8px;margin-top:0;
  }
  .act{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
    transition:.15s;opacity:0;
  }
  .act svg{width:15px;height:15px}
  .task:hover .act,.node-row:hover .act{opacity:.7}
  .act:hover{opacity:1;color:var(--ink);background:var(--line-soft)}
  .act.dive:hover{color:var(--amber)}
  .act.del:hover{color:#cf6a5a}

  /* ---- New task input ---- */
  .composer{
    display:flex;align-items:center;gap:12px;margin-top:8px;
    padding:11px 12px;border-radius:var(--radius);
    border:1px dashed var(--line);transition:border-color .15s;
  }
  .composer:focus-within{border-color:var(--amber)}
  .composer .plus{color:var(--amber);font-size:18px;line-height:1;flex:none}
  .composer input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-family:'Inter';font-size:16px;
  }
  .composer input::placeholder{color:var(--ink-faint)}

  /* ---- nested subtree, drawn as an indented staircase ---- */
  .subtree{
    margin-left:30px;                 /* indent under the parent's text */
    padding-left:0;
    overflow:hidden;
  }
  .subtree.collapsed{display:none}

  .node{
    position:relative;
    padding-left:22px;                /* room for the connector */
  }
  /* vertical spine running down a level */
  .node::before{
    content:"";position:absolute;left:6px;top:0;bottom:0;
    width:1px;background:var(--line);
  }
  /* last child: spine stops at the elbow so it doesn't overshoot */
  .node:last-child::before{bottom:calc(100% - 17px)}

  .node-row{
    display:flex;align-items:flex-start;gap:8px;
    padding:6px 6px 6px 0;border-radius:8px;
    position:relative;transition:background .12s;
  }
  /* horizontal elbow joining spine to the row */
  .node-row::before{
    content:"";position:absolute;left:-16px;top:16px;
    width:14px;height:1px;background:var(--line);
  }
  .node-row:hover{background:var(--line-soft)}
  .node-row.dragover{background:var(--amber-soft);box-shadow:inset 0 0 0 1px var(--amber)}

  .node .twirl{width:20px;height:20px}
  .node .check{width:18px;height:18px}
  .node .text{font-size:14.5px}
  .node.done > .node-row .text{
    color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--ink-faint);
  }
  .node.done > .node-row .check{background:var(--done);border-color:var(--done)}
  .node.done > .node-row .check svg{opacity:1;transform:scale(1)}

  .empty{
    text-align:center;padding:38px 20px 30px;color:var(--ink-faint);
  }
  /* ---- drag & drop visuals ---- */
  /* the lifted block follows the finger; raised look while dragging */
  .lifting{
    position:relative;z-index:90;
    box-shadow:0 18px 40px -10px rgba(0,0,0,.75);
    cursor:grabbing;
    transition:box-shadow .15s ease;
  }
  body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
  /* neighbours glide apart to make room (transform only — layout untouched) */
  .pushing{transition:transform .16s ease}
  [data-id]{transition:transform .16s ease}
  /* drop indicators: a line before/after, a highlight box for "inside" */
  [data-row-id]{position:relative}
  .drop-before::after,.drop-after::after{
    content:"";position:absolute;left:0;right:8px;height:3px;
    background:var(--amber);border-radius:3px;z-index:5;
    box-shadow:0 0 8px -1px var(--amber);
  }
  .drop-before::after{top:-2px}
  .drop-after::after{bottom:-2px}
  /* Nest INTO another task → a bold highlight box, clearly different from the line. */
  .drop-inside{
    box-shadow:inset 0 0 0 2px var(--amber), 0 0 0 1px var(--amber);
    border-radius:9px;
    background:linear-gradient(0deg, rgba(217,154,60,.18), rgba(217,154,60,.18)), var(--amber-soft);
  }
  .drop-inside > .node-row, .drop-inside > .task{ background:transparent; }
  .drop-inside::after{
    content:"⤵ sous-tâche";position:absolute;right:10px;top:50%;
    transform:translateY(-50%);font-size:11px;color:var(--amber);
    background:#211d15;padding:1px 7px;border-radius:99px;border:1px solid var(--amber);
    z-index:6;pointer-events:none;white-space:nowrap;
  }
  /* let touch drags work: allow vertical scroll normally, JS handles the long-press */
  .task,.node-row{touch-action:pan-y}
  /* while dragging, freeze native touch gestures so the page doesn't scroll away */
  html.dragging-lock,html.dragging-lock body{touch-action:none}
  html.dragging-lock .task,html.dragging-lock .node-row{touch-action:none}
  .empty .glyph{font-family:'Fraunces';font-size:46px;color:var(--line);margin-bottom:10px}
  .empty p{font-size:14px;max-width:340px;margin:0 auto;line-height:1.6}
  .empty em{font-style:italic;color:var(--ink-dim)}

  .footnote{
    margin-top:28px;padding-top:14px;border-top:1px solid var(--line-soft);
    color:var(--ink-faint);font-size:12px;display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:8px;
  }
  .footnote a{color:var(--ink-dim);cursor:pointer;text-decoration:none}
  .footnote a:hover{color:var(--amber)}

  /* ---- emoji in the card's top-left corner (also the expand toggle) ---- */
  .emoji-btn{
    position:absolute;top:10px;left:10px;z-index:2;
    width:32px;height:32px;border-radius:9px;
    border:1px solid transparent;
    background:rgba(255,255,255,.04);
    font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:.15s;
  }
  .emoji-btn:hover{border-color:var(--card-dot);background:rgba(255,255,255,.08)}
  .emoji-btn.empty{font-size:15px;color:var(--ink-faint);opacity:0}
  .card:hover .emoji-btn.empty{opacity:.6}
  /* tiny caret hint showing the card can fold, only when it has children */
  .emoji-btn.open::after,.emoji-btn:not(.open).has-fold::after{content:none}
  /* make room for the corner emoji */
  .card.has-emoji > .task{padding-left:50px}
  .card.has-emoji > .subtree{padding-left:50px!important}

  /* ---- top-right metrics badge + color dot ---- */
  .topright{
    position:absolute;top:10px;right:12px;
    display:flex;align-items:center;gap:9px;
    pointer-events:auto;
  }
  .card > .task{padding-right:118px;padding-bottom:34px;min-height:56px}   /* room for badge (top-right) + actions (bottom-right) */
  .badge{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink-faint)}
  .b-prog{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .b-bar{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .b-bar > i{display:block;height:100%;background:var(--card-dot);width:0}
  .b-lvl{
    white-space:nowrap;padding:1px 6px;border-radius:99px;
    background:rgba(255,255,255,.05);color:var(--ink-dim);
  }
  .color-btn{
    width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
    cursor:pointer;padding:0;flex:none;transition:.15s;
  }
  .color-btn:hover{transform:scale(1.15);border-color:rgba(255,255,255,.4)}

  /* ---- attribute chips ---- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
    padding:2px 8px;border-radius:99px;border:1px solid var(--line);
    color:var(--ink-dim);background:var(--chip-bg);
  }
  .chip i{width:7px;height:7px;border-radius:50%;flex:none}
  .chip svg{width:12px;height:12px}
  .chip.date.soon{color:var(--amber);border-color:#4a3a1a}
  .chip.date.overdue{color:#cf6a5a;border-color:#4a2420}

  /* ---- popovers ---- */
  .pop{
    position:fixed;z-index:50;background:var(--pop-bg);border:1px solid var(--line);
    border-radius:12px;padding:10px;box-shadow:0 12px 40px -8px rgba(0,0,0,.7);
    animation:pop .12s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .pop-emoji{width:236px}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
  .emoji-grid button{
    background:none;border:none;cursor:pointer;font-size:18px;
    width:27px;height:27px;border-radius:7px;transition:.1s;
  }
  .emoji-grid button:hover{background:var(--line-soft);transform:scale(1.15)}
  .pop-clear,.date-clear{
    margin-top:8px;width:100%;background:none;border:1px solid var(--line);
    color:var(--ink-dim);border-radius:8px;padding:5px;cursor:pointer;font-size:12px;
  }
  .pop-clear:hover{color:#cf6a5a;border-color:#4a2420}
  .color-row{display:flex;gap:8px}
  .swatch{
    width:26px;height:26px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;padding:0;transition:.12s;
  }
  .swatch:hover{transform:scale(1.15)}
  .swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px #211d15,0 0 0 3px var(--ink)}
  .pop-attr{width:220px}
  .pop-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-faint);margin:2px 2px 6px}
  .pop-h:not(:first-child){margin-top:12px}
  .status-row{display:flex;flex-direction:column;gap:3px}
  .status-opt{
    display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:13px;font-family:'Inter';text-align:left;
    padding:6px 8px;border-radius:7px;transition:.1s;
  }
  .status-opt i{width:9px;height:9px;border-radius:50%;flex:none}
  .status-opt:hover{background:var(--line-soft);color:var(--ink)}
  .status-opt.sel{background:var(--line-soft);color:var(--ink)}
  .date-row{display:flex;gap:6px;align-items:center}
  .date-input{
    flex:1;background:#16140f;border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:6px 8px;font-family:'Inter';font-size:13px;
    color-scheme:dark;
  }
  .date-clear{margin-top:0;width:32px;flex:none;font-size:16px;line-height:1}

  /* ---- action menu (mobile ⋯) ---- */
  .pop-menu{width:208px;padding:6px}
  .menu-item{
    display:flex;align-items:center;gap:11px;width:100%;
    background:none;border:none;cursor:pointer;text-align:left;
    color:var(--ink);font-family:'Inter';font-size:14px;
    padding:10px 10px;border-radius:9px;transition:.1s;
  }
  .menu-item:hover,.menu-item:active{background:var(--line-soft)}
  .menu-item.danger{color:#cf6a5a}
  .mi-ic{display:grid;place-items:center;width:18px;height:18px;flex:none;color:var(--ink-dim)}
  .mi-ic svg{width:16px;height:16px}
  .menu-item.danger .mi-ic{color:#cf6a5a}

  /* The ⋯ overflow button is desktop-hidden; inline buttons are mobile-hidden. */
  .act.more{display:none}

  @media (max-width:600px){
    .wrap{padding:
      calc(20px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
      calc(88px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    }
    .crumb.current{font-size:24px}
    .logo{width:21px;height:21px}

    /* keep every row strictly horizontal */
    .task,.node-row{flex-wrap:nowrap}

    /* collapse the action cluster to a single ⋯ menu */
    .actions .act{display:none}
    .actions .act.more{display:grid;opacity:.7}

    /* emoji tight in the corner */
    .emoji-btn{width:28px;height:28px;top:9px;left:9px;font-size:16px}
    .card.has-emoji > .task{padding-left:42px}
    .card.has-emoji > .subtree{padding-left:22px!important}

    /* ⋯ menu pinned top-right of a card header */
    .card > .task > .actions{position:absolute;top:8px;right:10px}
    .task{gap:7px;padding:10px 10px}
    .node-row{gap:6px;padding-top:7px;padding-bottom:7px}

    /* right side of a card header: [badge] [⋯] — no grip to reserve anymore */
    .card > .task{padding-right:96px;padding-bottom:10px;min-height:0}
    .topright{top:12px;right:42px;gap:0}
    .b-lvl{display:none}
    .color-btn{display:none}
    .b-bar{width:28px}
    .badge{font-size:10.5px}
    .twirl{width:24px;height:24px}
    .check{width:22px;height:22px}
    .node .check{width:20px;height:20px}
  }

  /* Touch devices have no hover: reveal the overflow trigger permanently */
  @media (hover:none){
    .act.more{opacity:.75}
    .emoji-btn.empty{opacity:.5}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="aurora-bg" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="wrap">
  <header>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="subtitle" id="subtitle"></div>
  </header>

  <div id="agenda" class="agenda" style="display:none"></div>

  <ul class="list" id="list"></ul>

  <div class="composer">
    <span class="plus">+</span>
    <input id="composer" type="text" autocomplete="off"
           placeholder="Ajouter une tâche…   (Entrée)">
  </div>

  <div class="footnote">
    <span>Tout doux · tout est enregistré sur cet appareil</span>
    <span><a id="theme">☾ thème</a> · <a id="popout" style="display:none">⧉ fenêtre flottante</a><span id="popsep" style="display:none"> · </span><a id="export">exporter</a> · <a id="import">importer</a></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORE = "tiroir.v1";
  const uid = () => Math.random().toString(36).slice(2,9);
  // YYYY-MM-DD for n days from today — used only for the first-run demo content.
  const demoDate = (n)=>{ const d=new Date(); d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

  // Tree: { id, text, done, children:[] }. Virtual root holds everything.
  const isFresh = !localStorage.getItem(STORE);  // true on a brand-new device
  let root = load();
  let path = [root.id];            // ids from root → current focus
  let nodes = new Map();           // id -> node, rebuilt on render
  let closedPreviews = new Set();  // ids the user explicitly collapsed (open is default)

  function load(){
    try{
      const raw = localStorage.getItem(STORE);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { id:"root", text:"Tout doux", done:false, children:[
      { id:uid(), text:"Bienvenue dans Tout doux 👋", done:false, emoji:"👋", color:"amber", children:[
        { id:uid(), text:"Touche la flèche d’un bloc pour le déplier", done:false, children:[] },
        { id:uid(), text:"Le rond à gauche coche une tâche comme terminée", done:false, children:[] },
        { id:uid(), text:"Appuie longuement sur une tâche pour la glisser ailleurs", done:false, children:[] },
        { id:uid(), text:"Le menu “…” permet d’ajouter un statut, une date, un emoji ou une couleur", done:false, children:[] }
      ]},
      { id:uid(), text:"Ranger la maison", done:false, emoji:"🏠", color:"blue", children:[
        { id:uid(), text:"Cuisine", done:false, children:[
          { id:uid(), text:"Faire la vaisselle", done:false, status:"urgent", children:[] },
          { id:uid(), text:"Nettoyer le plan de travail", done:false, status:"doing", children:[] },
          { id:uid(), text:"Vider la poubelle", done:true, status:"done", children:[] },
          { id:uid(), text:"Commander des éponges", done:false, status:"waiting", due:demoDate(2), children:[] }
        ]},
        { id:uid(), text:"Chambre", done:false, children:[
          { id:uid(), text:"Changer les draps", done:false, status:"todo", due:demoDate(1), children:[] },
          { id:uid(), text:"Ranger l’armoire", done:false, status:"doing", children:[] }
        ]},
        { id:uid(), text:"Salle de bain", done:false, children:[
          { id:uid(), text:"Nettoyer le lavabo", done:false, status:"todo", children:[] },
          { id:uid(), text:"Laver le miroir", done:false, status:"urgent", due:demoDate(0), children:[] }
        ]}
      ]},
      { id:uid(), text:"Liste de courses", done:false, emoji:"🛒", color:"green", children:[
        { id:uid(), text:"Légumes", done:false, children:[
          { id:uid(), text:"Tomates", done:false, children:[] },
          { id:uid(), text:"Courgettes", done:false, children:[] }
        ]},
        { id:uid(), text:"Pain", done:false, children:[] }
      ]}
    ]};
  }
  function save(){ localStorage.setItem(STORE, JSON.stringify(root)); }

  function index(node){
    nodes.set(node.id, node);
    node.children.forEach(index);
  }
  function current(){ return nodes.get(path[path.length-1]); }

  // count leaves done/total recursively for progress
  function stats(node){
    let done=0,total=0;
    for(const c of node.children){
      total++; if(c.done) done++;
      const s = stats(c); done+=s.done; total+=s.total;
    }
    return {done,total};
  }
  function depthCount(node){
    if(!node.children.length) return 0;
    return 1+Math.max(...node.children.map(depthCount));
  }

  // ---- card color palette (name -> accent + soft tint) ----
  function hexToRgba(hex, a){
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  const COLORS = {
    slate:  {dot:"#7d8aa0", tint:"#1d2330", line:"#2c3547"},
    blue:   {dot:"#4a78b0", tint:"#161f2e", line:"#243349"},
    green:  {dot:"#4a8c6f", tint:"#152620", line:"#21392f"},
    amber:  {dot:"#d99a3c", tint:"#241c0f", line:"#3a2f15"},
    rose:   {dot:"#cf6a7a", tint:"#271317", line:"#3d2026"},
    violet: {dot:"#9b7bc4", tint:"#1f1830", line:"#2f2647"},
    teal:   {dot:"#48a0a8", tint:"#102426", line:"#1d3a3d"},
  };
  const COLOR_ORDER = ["slate","blue","green","amber","rose","violet","teal"];

  // ---- task status definitions ----
  const STATUS = {
    todo:    {label:"À faire",   dot:"#7d8aa0"},
    doing:   {label:"En cours",  dot:"#4a78b0"},
    waiting: {label:"En attente",dot:"#d99a3c"},
    urgent:  {label:"Urgent",    dot:"#cf6a5a"},
    done:    {label:"Terminé",   dot:"#4a8c6f"},
  };
  const STATUS_ORDER = ["todo","doing","waiting","urgent"];

  function fmtDate(iso){
    if(!iso) return "";
    const d=new Date(iso+"T00:00:00");
    const today=new Date(); today.setHours(0,0,0,0);
    const diff=Math.round((d-today)/86400000);
    const s=d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    if(diff===0) return "aujourd’hui";
    if(diff===1) return "demain";
    if(diff===-1) return "hier";
    if(diff<0) return s+" · en retard";
    if(diff<7) return s;
    return s;
  }
  function dateState(iso){
    if(!iso) return "";
    const d=new Date(iso+"T00:00:00");
    const today=new Date(); today.setHours(0,0,0,0);
    const diff=Math.round((d-today)/86400000);
    if(diff<0) return "overdue";
    if(diff<=1) return "soon";
    return "";
  }

  // ---------- render ----------
  const $list = document.getElementById('list');
  const $crumbs = document.getElementById('crumbs');
  const $subtitle = document.getElementById('subtitle');

  function render(){
    nodes = new Map(); index(root);
    // sanitize path (in case of deletions)
    path = path.filter(id => nodes.has(id));
    if(!path.length) path=[root.id];

    renderCrumbs();
    renderSubtitle();
    renderAgenda();
    renderTasks();
    save();
  }

  function renderCrumbs(){
    $crumbs.innerHTML="";
    path.forEach((id,i)=>{
      const node = nodes.get(id);
      const last = i===path.length-1;
      const b = document.createElement('button');
      b.className = "crumb"+(last?" current":"");
      if(node===root){
        if(last){
          b.innerHTML=`<svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="3.5" y="3.5" width="25" height="25" rx="9" stroke="#d99a3c" stroke-width="2.2"/>
            <path d="M10.5 17 14.5 21 21.5 11.5" stroke="#d99a3c" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>Tout doux`;
        } else {
          b.textContent="Tout doux";
        }
      } else {
        b.textContent = node.emoji? node.emoji+" "+node.text : node.text;
      }
      if(!last) b.onclick = ()=>{ path = path.slice(0,i+1); render(); };
      $crumbs.appendChild(b);
      if(!last){
        const s=document.createElement('span');
        s.className="sep"; s.textContent="ᐳ"; $crumbs.appendChild(s);
      }
    });
  }

  function renderSubtitle(){
    const node = current();
    $subtitle.textContent = node.children.length ? "" : "aucune tâche pour l’instant";
    // Per-card progress and depth live on each card's badge — no global counter here.
  }

  // "À faire cette semaine": tasks due within 7 days, plus anything marked
  // Urgent. Only shown at the top level, and only when there's something.
  const $agenda=document.getElementById('agenda');
  function collectAgenda(){
    const today=new Date(); today.setHours(0,0,0,0);
    const items=[];
    const walk=(n)=>{
      for(const c of n.children){
        if(!c.done){
          let dueDiff=null;
          if(c.due){
            const d=new Date(c.due+"T00:00:00");
            dueDiff=Math.round((d-today)/86400000);
          }
          const inWeek = dueDiff!==null && dueDiff<=7;   // includes overdue + next 7 days
          const isUrgent = c.status==='urgent';
          if(inWeek || isUrgent){
            items.push({id:c.id, text:c.text, emoji:c.emoji, due:c.due, dueDiff, isUrgent});
          }
        }
        walk(c);
      }
    };
    walk(root);
    // sort: dated items chronologically first, then undated urgents
    items.sort((a,b)=>{
      const ad=a.dueDiff===null?Infinity:a.dueDiff;
      const bd=b.dueDiff===null?Infinity:b.dueDiff;
      if(ad!==bd) return ad-bd;
      return 0;
    });
    return items;
  }

  function renderAgenda(){
    // only at the main menu (root focus)
    if(path.length!==1){ $agenda.style.display='none'; return; }
    const items=collectAgenda();
    if(!items.length){ $agenda.style.display='none'; $agenda.innerHTML=''; return; }

    const rows=items.map(it=>{
      let when, cls='';
      if(it.dueDiff!==null){
        when=fmtDate(it.due);
        const st=dateState(it.due);
        cls=st||'';
      } else {
        when='—'; cls='urgent';
      }
      const tag = it.isUrgent ? `<span class="agenda-tag">urgent</span>` : '';
      const label=(it.emoji?it.emoji+' ':'')+escapeHtml(it.text||'(sans titre)');
      return `<li class="agenda-item" data-id="${it.id}">
        <button class="agenda-check" data-check="${it.id}" aria-label="Marquer comme terminé"></button>
        <span class="agenda-when ${cls}">${when}</span>
        <span class="agenda-text" data-goto="${it.id}">${label}</span>
        ${tag}
      </li>`;
    }).join('');

    $agenda.innerHTML=`<h2>à faire cette semaine</h2><ul>${rows}</ul>`;
    $agenda.style.display='';
    // check button → mark the task done (it then leaves the recap)
    $agenda.querySelectorAll('.agenda-check').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const id=btn.dataset.check;
        const t=nodes.get(id);
        if(t){ navigator.vibrate&&navigator.vibrate(8); toggle(t); }
      };
    });
    // tapping the text jumps to the task in its branch
    $agenda.querySelectorAll('.agenda-text[data-goto]').forEach(el=>{
      el.onclick=()=>{ const id=el.dataset.goto; if(nodes.has(id)) focusNode(id); };
    });
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function renderTasks(){
    const node = current();
    $list.innerHTML="";
    if(!node.children.length){
      const e=document.createElement('div');
      e.className="empty";
      e.innerHTML=`<div class="glyph">⌑</div><p>Rien ici encore.<br>
        Ajoute une tâche ci-dessous, puis déplie-la avec la flèche pour y nicher des sous-tâches.</p>`;
      $list.appendChild(e);
      return;
    }
    node.children.forEach((child,i)=> $list.appendChild(cardEl(child, node, i)));
  }

  // SVG icon helpers
  const ICON = {

      stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>`,

  // A single task row (twirl, check, editable text, actions). depth>=0.
  function rowEl(t, parent, i, depth, extraActs){
    const row=document.createElement('div');
    row.className=(depth===0?"task":"node-row")+(t.done?" done":"");
    row.dataset.rowId=t.id;

    // long-press anywhere on the row lifts it for dragging
    setupDrag(null, row, t);

    // twirl (expand) — only meaningful if it has children
    const twirl=document.createElement('button');
    const hasKids=t.children.length>0;
    const open=hasKids && !closedPreviews.has(t.id);
    twirl.className="twirl"+(hasKids?"":" leaf")+(open?" open":"");
    twirl.innerHTML=ICON.chevron;
    twirl.title=open?"Replier":"Déplier";
    if(hasKids){
      twirl.onclick=()=>{
        if(closedPreviews.has(t.id)) closedPreviews.delete(t.id);
        else closedPreviews.add(t.id);
        render();
      };
    }

    // checkbox
    const check=document.createElement('button');
    check.className="check"; check.title="Terminer"; check.innerHTML=ICON.check;
    check.onclick=()=>toggle(t);

    // body / editable text
    const body=document.createElement('div'); body.className="body";
    const text=document.createElement('div');
    text.className="text"; text.contentEditable="true"; text.spellcheck=false;
    text.textContent=t.text;
    // Prevent iOS zoom-on-focus without changing the resting size: bump the
    // focused field to 16px via inline style, then remove it on blur.
    text.onfocus=()=>{ text.style.fontSize="16px"; };
    text.onblur=()=>{ text.style.fontSize=""; const v=text.textContent.trim(); t.text=v||"(sans titre)";
      if(!v)text.textContent=t.text; save(); renderCrumbs(); };
    text.onkeydown=(e)=>{
      if(e.key==="Enter"){ e.preventDefault(); text.blur(); }
    };
    body.appendChild(text);

    // attribute chips (status + due date), shown when set
    if(t.status || t.due){
      const chips=document.createElement('div'); chips.className="chips";
      if(t.status && STATUS[t.status]){
        const c=document.createElement('span');
        c.className="chip status "+t.status;
        c.innerHTML=`<i style="background:${STATUS[t.status].dot}"></i>${STATUS[t.status].label}`;
        chips.appendChild(c);
      }
      if(t.due){
        const c=document.createElement('span');
        const st=dateState(t.due);
        c.className="chip date "+st;
        c.innerHTML=`<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"
          stroke-linecap="round"><rect x="2" y="3" width="10" height="9" rx="1.5"/><path d="M2 5.5h10M4.5 2v2M9.5 2v2"/></svg>${fmtDate(t.due)}`;
        chips.appendChild(c);
      }
      body.appendChild(chips);
    }

    // ---- actions: shared definitions, rendered inline (desktop) + as a ⋯ menu (mobile) ----
    const baseActs=[
      {key:"add", label:"Ajouter une sous-tâche", icon:ICON.plus, cls:"", run:()=>{
        const c={id:uid(),text:"",done:false,children:[]};
        t.children.push(c); closedPreviews.delete(t.id); render(); focusNode(c.id);
      }},
      {key:"tag", label:"Statut & échéance", icon:ICON.tag, cls:"", run:(anchor)=>openAttrPopover(t, anchor)},
      {key:"dive", label:"Zoomer sur cette tâche", icon:ICON.dive, cls:"dive", run:()=>{
        path.push(t.id); render(); window.scrollTo({top:0,behavior:'smooth'});
      }},
      {key:"del", label:"Supprimer", icon:ICON.trash, cls:"del", run:()=>remove(t,parent)},
    ];
    const menuActs = (extraActs||[]).concat(baseActs);  // extras (emoji/color) first in the menu

    const actions=document.createElement('div'); actions.className="actions";
    // inline buttons for the base actions (desktop hover); extras live in the ⋯ menu only
    baseActs.forEach(a=>{
      const b=document.createElement('button');
      b.className="act "+a.cls; b.innerHTML=a.icon; b.title=a.label;
      b.onclick=(e)=>{ e.stopPropagation(); a.run(b); };
      actions.appendChild(b);
    });
    // overflow "⋯" → full menu (shown on mobile; on desktop also available for extras)
    const more=document.createElement('button');
    more.className="act more"; more.innerHTML=ICON.more; more.title="Actions";
    more.onclick=(e)=>{ e.stopPropagation(); openActionMenu(menuActs, more); };
    actions.appendChild(more);

    row.append(twirl,check,body,actions);
    return row;
  }

  // A node in the nested subtree: its row + (recursively) its own subtree.
  function nodeEl(t, parent, i, depth){
    const node=document.createElement('div');
    node.className="node"+(t.done?" done":"");
    node.dataset.id=t.id;
    node.appendChild(rowEl(t, parent, i, depth));
    if(t.children.length){
      const open=!closedPreviews.has(t.id);
      const sub=document.createElement('div');
      sub.className="subtree"+(open?"":" collapsed");
      t.children.forEach((c,j)=> sub.appendChild(nodeEl(c, t, j, depth+1)));
      node.appendChild(sub);
    }
    return node;
  }

  // A top-level card: emoji + colored block + metrics badge + nested subtree.
  function cardEl(t, parent, i){
    const card=document.createElement('div');
    const col=COLORS[t.color]||COLORS.slate;
    card.className="card"+(t.done?" done":"");
    card.dataset.id=t.id;
    // theme colour drives the dot + the bloom/glow accent (glass itself is neutral)
    card.style.setProperty('--card-dot', col.dot);

    // Card-only extra actions, surfaced in the ⋯ menu (emoji + colour).
    const extraActs=[
      {key:"emoji", label:t.emoji?"Changer l’emoji":"Ajouter un emoji", icon:ICON.smiley, cls:"",
        run:(anchor)=>openEmojiPicker(t, anchor)},
      {key:"color", label:"Couleur du bloc", icon:ICON.palette, cls:"",
        run:(anchor)=>openColorPicker(t, anchor)},
    ];
    const header=rowEl(t, parent, i, 0, extraActs);

    // Emoji in the corner is purely for identity — it opens the picker.
    const hasKids=t.children.length>0;
    const open=hasKids && !closedPreviews.has(t.id);
    const emojiBtn=document.createElement('button');
    emojiBtn.className="emoji-btn";
    emojiBtn.textContent=t.emoji||"＋";
    if(!t.emoji) emojiBtn.classList.add('empty');
    emojiBtn.title=t.emoji?"Changer l’emoji":"Choisir un emoji";
    emojiBtn.onclick=(e)=>{ e.stopPropagation(); openEmojiPicker(t, emojiBtn); };
    // The chevron (in the row) stays as the fold control — it already works for all rows.

    // metrics badge (top-right): progress + depth, per card
    const s=stats(t);
    const d=depthCount(t);
    const badge=document.createElement('div'); badge.className="badge";
    const pct=s.total?Math.round(s.done/s.total*100):0;
    let bits=[];
    if(s.total) bits.push(`<span class="b-prog"><span class="b-bar"><i style="width:${pct}%"></i></span>${s.done}/${s.total}</span>`);
    if(d>1) bits.push(`<span class="b-lvl">${d}\u202fniv.</span>`);
    badge.innerHTML=bits.join("");

    // small color dot — quick affordance on desktop (hidden on mobile, lives in menu)
    const colorBtn=document.createElement('button');
    colorBtn.className="color-btn"; colorBtn.title="Couleur du bloc";
    colorBtn.style.background=col.dot;
    colorBtn.onclick=(e)=>{ e.stopPropagation(); openColorPicker(t, colorBtn); };

    const topright=document.createElement('div'); topright.className="topright";
    topright.append(badge, colorBtn);
    header.appendChild(topright);

    card.classList.add('has-emoji');
    const glow=document.createElement('div'); glow.className="glow";
    card.appendChild(glow);
    card.appendChild(emojiBtn);
    card.appendChild(header);

    if(t.children.length){
      const open=!closedPreviews.has(t.id);
      if(open) card.classList.add('lit');     // glow when the block is open
      const sub=document.createElement('div');
      sub.className="subtree"+(open?"":" collapsed");
      sub.style.padding="0 12px 10px 28px";
      sub.style.marginLeft="0";
      t.children.forEach((c,j)=> sub.appendChild(nodeEl(c, t, j, 1)));
      card.appendChild(sub);
    }

    // brief glow pulse + glass thickening on touch/press
    card.addEventListener('pointerdown', ()=>{
      card.classList.add('lit','pressed');
    });
    const unpress=()=>{ card.classList.remove('pressed');
      if(closedPreviews.has(t.id)) card.classList.remove('lit'); };
    card.addEventListener('pointerup', unpress);
    card.addEventListener('pointercancel', unpress);
    if(!('ontouchstart' in window)){
      card.addEventListener('pointerleave', ()=>{
        card.classList.remove('pressed');
        if(closedPreviews.has(t.id)) card.classList.remove('lit');
      });
    }
    return card;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function focusNode(id){
    requestAnimationFrame(()=>{
      const el=$list.querySelector(`[data-id="${id}"] .text`);
      if(el){ el.focus();
        const r=document.createRange(); r.selectNodeContents(el);
        r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}
    });
  }

  // ---------- mutations ----------
  function toggle(t){
    t.done=!t.done;
    // cascade down so completing a parent completes its branch
    const cascade=(node,val)=>{ node.children.forEach(c=>{c.done=val;cascade(c,val);});};
    cascade(t,t.done);
    render();
  }
  function remove(t,parent){
    parent.children=parent.children.filter(c=>c.id!==t.id);
    render();
  }
  function addTop(text){
    current().children.push({id:uid(),text,done:false,children:[]});
    render();
  }

  // ---- tree helpers for free-form move ----
  function findParentOf(id, node){
    for(const c of node.children){
      if(c.id===id) return node;
      const r=findParentOf(id, c);
      if(r) return r;
    }
    return null;
  }
  function isDescendant(ancestorId, maybeChildId){
    // true if maybeChildId is inside the subtree of ancestorId
    const a=nodes.get(ancestorId);
    if(!a) return false;
    const walk=(n)=>{
      for(const c of n.children){
        if(c.id===maybeChildId) return true;
        if(walk(c)) return true;
      }
      return false;
    };
    return walk(a);
  }
  // Move node `srcId` to a position relative to `dstId`.
  // mode: 'before' | 'after' (sibling of dst) | 'inside' (first child of dst)
  function moveNode(srcId, dstId, mode){
    if(srcId===dstId) return false;
    // can't drop a node into itself or its own descendants
    if(mode==='inside' && (srcId===dstId || isDescendant(srcId, dstId))) return false;
    if((mode==='before'||mode==='after') && isDescendant(srcId, dstId)) return false;

    const src=nodes.get(srcId), dst=nodes.get(dstId);
    if(!src||!dst) return false;
    const srcParent=findParentOf(srcId, root);
    if(!srcParent) return false;

    // detach
    srcParent.children=srcParent.children.filter(c=>c.id!==srcId);

    if(mode==='inside'){
      dst.children.unshift(src);
      closedPreviews.delete(dst.id); // reveal so the moved task is visible
    } else {
      const dstParent=findParentOf(dstId, root);
      if(!dstParent){ // dst is a top-level card; reattach src at root level
        const arr=root.children;
        const idx=arr.findIndex(c=>c.id===dstId);
        arr.splice(mode==='after'?idx+1:idx, 0, src);
      } else {
        const arr=dstParent.children;
        const idx=arr.findIndex(c=>c.id===dstId);
        arr.splice(mode==='after'?idx+1:idx, 0, src);
      }
    }
    return true;
  }

  // ---------- popover system ----------
  let activePop=null;
  function closePop(){ if(activePop){ activePop.remove(); activePop=null;
    document.removeEventListener('mousedown',onDocDown,true); } }
  function onDocDown(e){ if(activePop && !activePop.contains(e.target)) closePop(); }
  function openPop(anchor, build){
    closePop();
    const pop=document.createElement('div'); pop.className="pop";
    build(pop);
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    const pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=r.left, top=r.bottom+6;
    if(left+pw>innerWidth-10) left=innerWidth-pw-10;
    if(left<10) left=10;
    if(top+ph>innerHeight-10) top=r.top-ph-6;
    pop.style.left=left+"px"; pop.style.top=Math.max(10,top)+"px";
    activePop=pop;
    setTimeout(()=>document.addEventListener('mousedown',onDocDown,true),0);
  }

  const EMOJIS = ["🛒","🎬","🎞️","📹","✍️","📝","💼","💰","📅","🏠","🧹","🍳","🥕","🎂",
    "✈️","🏖️","🎁","🎉","📚","🎓","💡","🔧","🛠️","🎹","🎸","🎮","🐱","🌿","💍","❤️",
    "⭐","🔥","⚡","✅","📌","📎","🧠","🩺","🏃","⚽","🎨","📷","☕","🍷","🌍","🚗"];

  // ---------- drag & drop (long-press lift; the row follows the finger) ----------
  let drag=null;

  function setupDrag(handle, row, t){
    const isControl=(target)=> !!(target.closest && target.closest('.act,.check,.twirl,.emoji-btn,.chip,.color-btn'));

    row.addEventListener('pointerdown', e=>{
      if(e.button && e.button!==0) return;
      if(isControl(e.target)) return;
      const start={x:e.clientX,y:e.clientY,e};
      let timer=null, armed=true;

      const onWinMove=(ev)=>{
        if(!armed || drag) return;
        const dx=Math.abs(ev.clientX-start.x), dy=Math.abs(ev.clientY-start.y);
        if(e.pointerType==='mouse'){
          if(dx>4||dy>4){ cleanup(); startDrag(start.e, t, row); }
        } else {
          if(dx>12||dy>12){ armed=false; cleanup(); }   // it's a scroll, cancel long-press
        }
      };
      const onWinUp=()=>{ cleanup(); };
      function cleanup(){
        armed=false; clearTimeout(timer);
        window.removeEventListener('pointermove', onWinMove);
        window.removeEventListener('pointerup', onWinUp);
        window.removeEventListener('pointercancel', onWinUp);
      }
      window.addEventListener('pointermove', onWinMove, {passive:true});
      window.addEventListener('pointerup', onWinUp, {once:true});
      window.addEventListener('pointercancel', onWinUp, {once:true});

      if(e.pointerType!=='mouse'){
        timer=setTimeout(()=>{
          if(!armed) return;
          cleanup();
          navigator.vibrate&&navigator.vibrate(15);
          startDrag(start.e, t, row);
        }, 300);
      }
    });
    row.addEventListener('contextmenu', e=>{ if(drag) e.preventDefault(); });
  }

  function blockTouchScroll(e){ if(drag) e.preventDefault(); }
  function outerBlock(row){
    // For a card header, the movable block is the whole .card.
    // For a nested row, it's the DIRECT .node (its immediate parent), not an
    // ancestor .node that would wrap several sub-tasks.
    if(row.classList.contains('task')) return row.closest('.card') || row;
    if(row.parentElement && row.parentElement.classList.contains('node')) return row.parentElement;
    return row.closest('.node') || row;
  }

  function startDrag(e, t, row){
    if(drag) return;
    if(e.cancelable) e.preventDefault();
    const block=outerBlock(row);
    const rect=block.getBoundingClientRect();

    drag={
      srcId:t.id, row, block,
      pointerId:e.pointerId,
      grabX:e.clientX, grabY:e.clientY,
      originLeft:rect.left, originTop:rect.top,
      target:null, mode:null, pushed:null
    };

    // lift the real block: it follows the finger via transform
    block.classList.add('lifting');
    block.style.width=rect.width+'px';
    block.style.pointerEvents='none';     // so elementFromPoint reads beneath it
    document.body.classList.add('dragging');
    document.documentElement.classList.add('dragging-lock');
    moveLift(e.clientX, e.clientY);

    window.addEventListener('touchmove', blockTouchScroll, {passive:false});
    window.addEventListener('pointermove', onDragMove, {passive:false});
    window.addEventListener('pointerup', onDragEnd, {once:true});
    window.addEventListener('pointercancel', onDragEnd, {once:true});
  }

  function moveLift(x,y){
    if(!drag) return;
    const dx=x-drag.grabX, dy=y-drag.grabY;
    drag.block.style.transform=`translate(${dx}px, ${dy}px) scale(1.02)`;
  }

  function onDragMove(e){
    if(!drag) return;
    e.preventDefault();
    moveLift(e.clientX, e.clientY);

    const margin=80;
    if(e.clientY<margin) window.scrollBy(0,-14);
    else if(e.clientY>innerHeight-margin) window.scrollBy(0,14);

    clearDropMarks();
    clearPush();

    // Geometric hit-test on the UNTRANSFORMED layout. We skip the lifted block
    // and any of its descendants, and we ignore the lifted block's moved rect by
    // testing every other row's own (static) rectangle against the pointer Y.
    const rows=[...document.querySelectorAll('[data-row-id]')];
    let best=null, bestDist=Infinity;
    for(const rEl of rows){
      const id=rEl.dataset.rowId;
      if(id===drag.srcId) continue;                 // never target the dragged item
      if(drag.block.contains(rEl)) continue;        // nor anything inside the lifted block
      const rc=rEl.getBoundingClientRect();
      if(rc.height===0) continue;
      if(rc.bottom<-40 || rc.top>innerHeight+40) continue;
      if(e.clientY>=rc.top && e.clientY<=rc.bottom){ best=rEl; bestDist=0; break; }
      const d=Math.min(Math.abs(e.clientY-rc.top), Math.abs(e.clientY-rc.bottom));
      if(d<bestDist){ bestDist=d; best=rEl; }
    }
    if(!best || bestDist>44){ drag.target=null; drag.mode=null; return; }
    const dstId=best.dataset.rowId;
    if(dstId===drag.srcId || isDescendant(drag.srcId, dstId)){ drag.target=null; drag.mode=null; return; }

    const r=best.getBoundingClientRect();
    const rel=(e.clientY-r.top)/r.height;          // 0 (top) .. 1 (bottom)
    const txt=best.querySelector('.text');
    const textLeft = txt ? txt.getBoundingClientRect().left : r.left+60;
    // "inside" needs a clear rightward push, well past the text start (not just 30px),
    // so reordering between sibling sub-tasks stays easy to hit.
    const deepRight = e.clientX > textLeft + 80;

    let mode;
    if(rel < 0.34) mode='before';                  // top third → place above
    else if(rel > 0.66) mode='after';              // bottom third → place below
    else mode = deepRight ? 'inside' : 'after';    // middle: nest only if pushed far right

    drag.target=dstId; drag.mode=mode;
    paintDropMark(best, mode);
    pushNeighbors(best, mode);
  }

  // Visually separate neighbours by translating them — no DOM change, so
  // hit-testing stays reliable (this is what broke the previous attempt).
  function pushNeighbors(rowEl2, mode){
    if(mode==='inside') return;     // nesting shows a box, no separation needed
    const block=outerBlock(rowEl2);
    const amount=14;
    if(mode==='before'){
      block.style.transform=`translateY(${amount}px)`;
      block.classList.add('pushing');
      drag.pushed=[block];
    } else {
      // push the NEXT sibling block down (and this one stays)
      let nb=block.nextElementSibling;
      while(nb && !nb.matches('[data-id]')) nb=nb.nextElementSibling;
      if(nb){ nb.style.transform=`translateY(${amount}px)`; nb.classList.add('pushing'); drag.pushed=[nb]; }
      else { block.style.transform=`translateY(-${0}px)`; }
    }
  }
  function clearPush(){
    if(drag && drag.pushed){
      drag.pushed.forEach(n=>{ n.style.transform=''; n.classList.remove('pushing'); });
      drag.pushed=null;
    }
  }

  function paintDropMark(rowEl2, mode){ rowEl2.classList.add('drop-'+mode); }
  function clearDropMarks(){
    document.querySelectorAll('.drop-before,.drop-after,.drop-inside')
      .forEach(n=>n.classList.remove('drop-before','drop-after','drop-inside'));
  }

  function onDragEnd(){
    if(!drag) return;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('touchmove', blockTouchScroll);
    const {srcId,target,mode,block}=drag;
    // reset the lifted block's inline styles
    block.classList.remove('lifting');
    block.style.transform=''; block.style.width=''; block.style.pointerEvents='';
    clearPush();
    clearDropMarks();
    document.body.classList.remove('dragging');
    document.documentElement.classList.remove('dragging-lock');
    drag=null;
    if(target && mode){
      if(moveNode(srcId, target, mode)){ render(); }
    }
  }

  // ---------- composer ----------
  const $composer=document.getElementById('composer');
  $composer.addEventListener('keydown',(e)=>{
    if(e.key==="Enter"){
      const v=$composer.value.trim();
      if(v){ addTop(v); $composer.value=""; }
    }
    if(e.key==="Escape") $composer.blur();
  });

  // ---------- export / import ----------
  document.getElementById('export').onclick=()=>{
    const blob=new Blob([JSON.stringify(root,null,2)],{type:"application/json"});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="tiroir-"+new Date().toISOString().slice(0,10)+".json";
    a.click();
  };
  document.getElementById('import').onclick=()=>{
    const inp=document.createElement('input'); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{ root=JSON.parse(r.result); path=[root.id]; collapseAll(); render(); }
        catch(err){ alert("Fichier illisible."); } };
      r.readAsText(f);
    };
    inp.click();
  };

  // ---------- theme toggle (dark default / light) ----------
  (function setupTheme(){
    const btn=document.getElementById('theme');
    const KEY='tiroir.theme';
    const apply=(t)=>{
      document.body.classList.toggle('light', t==='light');
      document.documentElement.classList.toggle('light', t==='light');
      btn.textContent = t==='light' ? '☀ thème' : '☾ thème';
      // keep the floating window (if open) in sync
      try{
        const w=window.documentPictureInPicture && documentPictureInPicture.window;
        if(w){ w.document.body.className=document.body.className;
          w.document.documentElement.className=document.documentElement.className;
          w.document.documentElement.style.background = t==='light' ? '#efe9dc' : '#16140f'; }
      }catch(e){}
    };
    let cur='dark';
    try{ cur=localStorage.getItem(KEY)||'dark'; }catch(e){}
    apply(cur);
    btn.onclick=()=>{
      cur = document.body.classList.contains('light') ? 'dark' : 'light';
      apply(cur);
      try{ localStorage.setItem(KEY, cur); }catch(e){}
    };
  })();

  // ---------- floating window (Document Picture-in-Picture) ----------
  // Pops the whole app into an always-on-top window (Chromium browsers: Arc,
  // Chrome, Edge, recent Firefox). Hidden where unsupported (e.g. Safari).
  (function setupPiP(){
    const btn=document.getElementById('popout');
    const sep=document.getElementById('popsep');
    if(!('documentPictureInPicture' in window)) return;   // unsupported → stay hidden
    btn.style.display=''; sep.style.display='';

    let pipWin=null;
    const wrap=document.querySelector('.wrap');

    btn.onclick=async ()=>{
      if(pipWin){ pipWin.close(); return; }
      try{
        pipWin=await documentPictureInPicture.requestWindow({width:380, height:600});
      }catch(e){ return; }

      // copy all styles into the PiP window
      document.querySelectorAll('style, link[rel="stylesheet"]').forEach(node=>{
        pipWin.document.head.appendChild(node.cloneNode(true));
      });
      // carry the current theme into the floating window
      pipWin.document.documentElement.className=document.documentElement.className;
      pipWin.document.body.className=document.body.className;
      pipWin.document.body.style.margin="0";
      // solid base background on both html and body so nothing shows through
      const isLight=document.body.classList.contains('light');
      const baseBg = isLight ? "#efe9dc" : "#16140f";
      pipWin.document.documentElement.style.background = baseBg;
      pipWin.document.body.style.background = baseBg;
      pipWin.document.body.style.minHeight = "100%";

      // move the live app element into the floating window
      pipWin.document.body.appendChild(wrap);
      btn.textContent="⧉ refermer la fenêtre";

      pipWin.addEventListener('pagehide', ()=>{
        // bring the app back into the main page
        document.body.appendChild(wrap);
        btn.textContent="⧉ fenêtre flottante";
        pipWin=null;
      });
    };
  })();

  // Collapse every node that has children. Called once on page load so a
  // cold start always opens calm (everything folded). In-session toggles are
  // kept in memory and survive app-switching (the page isn't reloaded then).
  function collapseAll(){
    closedPreviews=new Set();
    const walk=(n)=>{ if(n.children.length) { if(n!==root) closedPreviews.add(n.id); n.children.forEach(walk); } };
    walk(root);
  }

  collapseAll();
  // On a brand-new device, gently reveal the first two demo blocks (one level)
  // so newcomers immediately see how the room → tasks hierarchy works.
  if(isFresh){
    root.children.slice(0,2).forEach(b=> closedPreviews.delete(b.id));
    // also reveal the first room (Cuisine) so its status & due-date chips are visible
    const maison=root.children[1];
    if(maison && maison.children[0]) closedPreviews.delete(maison.children[0].id);
  }
  render();
})();
</script>
</body>
</html>
